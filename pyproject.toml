[project]
name = "talli"
version = "0.1.0"
description = "Talli filing simulation engine for Norwegian holding companies"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "reportlab==5.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["holding_core*", "holding_cli*"]

[tool.setuptools.package-data]
holding_core = ["assets/fonts/*"]

[project.scripts]
talli = "holding_cli.main:main"

[tool.ruff]
line-length = 110
