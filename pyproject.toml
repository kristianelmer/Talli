[project]
name = "talli"
version = "0.1.0"
description = "Talli filing simulation engine for Norwegian holding companies"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "reportlab>=4.4,<5",
]

[project.scripts]
talli = "holding_cli.main:main"

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "pypdf>=6,<7",
]

