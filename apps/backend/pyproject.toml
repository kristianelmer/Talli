[project]
name = "talli-backend"
version = "0.1.0"
description = "Talli FastAPI production boundary"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "reportlab==5.0.0",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talli_backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["billing_database: mandatory isolated billing database lifecycle (test:billing-database-lifecycle)"]
