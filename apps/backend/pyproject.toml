[project]
name = "talli-backend"
version = "0.1.0"
description = "Talli FastAPI production boundary"
requires-python = ">=3.12,<3.14"
dependencies = [
  "ada-url==4.0.0",
  "certifi==2026.10.23",
  "cryptography==50.0.1",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "pillow==13.0.0",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pyicu==2.16.2",
  "reportlab==5.0.0",
  "starlette==1.3.1",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talli_backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "accounts_database: mandatory isolated Accounts lifecycle and authorization (test:annual-accounts-database)",
  "company_tax_database: mandatory isolated Company Tax lifecycle and concurrency (test:company-tax-database)",
  "billing_database: mandatory isolated billing database lifecycle (test:billing-database-lifecycle)",
  "authority_database: mandatory isolated Authority Connections database lifecycle (test:authority-connections-database)",
]
