# INACTIVE TEMPLATE. Intentionally outside .github/workflows; never deployed here.
# Future activation requires fresh owner authority, a preconfigured/verified
# environment, and explicitly approved metadata-only credentials. Environment
# name alone does not establish protection. Never add lifecycle credentials.
# Provider token: scoped PAT project_admin_read, exact selected projects only
# (OAuth equivalent projects:read). Runtime permits project GETs, no org GET.
# This pilot admits a maximum five-minute metadata window only.
# GitHub comments are mutable; mailbox-only recovery cannot establish full history.
# Cancellation cleanup is best effort. Force kill/runner loss may interrupt it;
# neither always() nor this background child guarantees availability or cleanup.
name: Independent recovery metadata pilot (inactive template)

on:
  workflow_dispatch:
    inputs:
      config_b64:
        description: Public metadata-only config, base64 encoded
        required: true
        type: string
      authority_b64:
        description: Fresh public one-attempt metadata-only authority, base64 encoded
        required: true
        type: string
      expected_config_sha256:
        description: Independently held SHA-256 of exact decoded config bytes
        required: true
        type: string
      expected_authority_sha256:
        description: Independently held SHA-256 of exact decoded authority bytes
        required: true
        type: string

permissions: {}

jobs:
  independent-cleanup-pilot:
    name: Independent cleanup pilot
    if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: talli-recovery-cleanup-pilot
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/apps/backend/src
    steps:
      - name: Check out the dispatched immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked backend dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python -B -m pip install uv==0.10.2
          uv sync --project apps/backend --locked --no-dev

      - name: Decode public inputs and create private credentials
        env:
          CONFIG_B64: ${{ inputs.config_b64 }}
          AUTHORITY_B64: ${{ inputs.authority_b64 }}
          EXPECTED_CONFIG_SHA256: ${{ inputs.expected_config_sha256 }}
          EXPECTED_AUTHORITY_SHA256: ${{ inputs.expected_authority_sha256 }}
          METADATA_TOKEN: ${{ secrets.TALLI_RECOVERY_METADATA_TOKEN }}
          MAILBOX_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apps/backend/.venv/bin/python -B - <<'PY'
          import base64, hashlib, json, os, re, sys, tempfile, time
          from datetime import datetime
          from pathlib import Path
          from talli_backend.adapters.hosted_recovery_remote import load_inputs
          root = None
          try:
              os.umask(0o077)
              if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
                  raise ValueError()
              root = Path(tempfile.mkdtemp(prefix='talli-recovery-', dir=os.environ['RUNNER_TEMP']))
              expected = []
              for name, variable, digest_variable, bound in (
                  ('config.json', 'CONFIG_B64', 'EXPECTED_CONFIG_SHA256', 65536),
                  ('authority.json', 'AUTHORITY_B64', 'EXPECTED_AUTHORITY_SHA256', 32768)):
                  encoded = os.environ[variable]
                  digest = os.environ[digest_variable]
                  if len(encoded) > 4 * ((bound + 2) // 3) or not re.fullmatch('[0-9a-f]{64}', digest):
                      raise ValueError()
                  raw = base64.b64decode(encoded, validate=True)
                  if len(raw) > bound or hashlib.sha256(raw).hexdigest() != digest:
                      raise ValueError()
                  with (root / name).open('xb') as f:
                      f.write(raw)
                  expected.append(digest)
              config, authority = load_inputs(root / 'config.json', expected[0],
                  root / 'authority.json', expected[1])
              if (config['mode'] != 'metadata-only' or authority['mode'] != 'metadata-only'
                      or config['commit'] != os.environ['GITHUB_SHA']
                      or config['repository'] != os.environ['GITHUB_REPOSITORY']
                      or not 0 < datetime.fromisoformat(config['cleanupAtUtc']).timestamp() - time.time() <= 300):
                  raise ValueError()
              if not os.environ['METADATA_TOKEN'] or not os.environ['MAILBOX_TOKEN']:
                  raise ValueError()
              with (root / 'credentials.json').open('x') as f:
                  json.dump({'managementToken': os.environ['METADATA_TOKEN'],
                      'githubToken': os.environ['MAILBOX_TOKEN']}, f)
              with (root / 'digests.json').open('x') as f:
                  json.dump(expected, f)
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('TALLI_RECOVERY_DIR=' + str(root) + '\n')
          except BaseException:
              if root is not None:
                  import shutil
                  shutil.rmtree(root)
              sys.exit('hosted_pilot_prepare_failed')
          PY

      - name: Resolve actual job and retain runtime child until completion
        timeout-minutes: 3
        run: |
          set -euo pipefail
          apps/backend/.venv/bin/python -B - <<'PY'
          import json, os, signal, subprocess, sys, time
          from pathlib import Path
          from talli_backend.adapters.hosted_recovery_remote import load_inputs, binding_for
          from talli_backend.adapters.hosted_recovery_mailbox import resolve_job
          root = Path(os.environ['TALLI_RECOVERY_DIR'])
          def ticks(pid):
              return Path('/proc/' + str(pid) + '/stat').read_text().rsplit(')', 1)[1].split()[19]
          try:
              digests = json.loads((root / 'digests.json').read_text())
              config, _ = load_inputs(root / 'config.json', digests[0], root / 'authority.json', digests[1])
              provisional = binding_for(config, *digests, run_id=os.environ['GITHUB_RUN_ID'], job_id=1, attempt=1)
              provisional.pop('jobId')
              job_id = resolve_job(provisional, credentials_path=root / 'credentials.json')
              argv = [sys.executable, '-B', '-m', 'talli_backend.adapters.hosted_recovery_remote', 'serve',
                  '--metadata-only',
                  '--config', str(root / 'config.json'), '--expected-config-sha256', digests[0],
                  '--authority', str(root / 'authority.json'), '--expected-authority-sha256', digests[1],
                  '--credentials', str(root / 'credentials.json'), '--work', str(root / 'session'),
                  '--job-id', str(job_id)]
              pid = os.fork()
              if pid == 0:
                  # This guardian owns wait()/reaping. Later steps poll its exit
                  # record; they never try to wait() on a non-child PID.
                  child = None
                  try:
                      os.setsid()
                      with open(os.devnull, 'r+b', buffering=0) as null:
                          for fd in (0, 1, 2):
                              os.dup2(null.fileno(), fd)
                      def stop(signum, frame):
                          if child is not None and child.poll() is None:
                              child.terminate()
                      signal.signal(signal.SIGINT, stop)
                      signal.signal(signal.SIGTERM, stop)
                      child = subprocess.Popen(argv, stdin=subprocess.DEVNULL,
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      rc = child.wait(timeout=660)
                  except BaseException:
                      rc = 1
                  finally:
                      if child is not None and child.poll() is None:
                          child.terminate()
                          try:
                              child.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              child.kill()
                              child.wait(timeout=5)
                      with (root / 'runtime-status.partial').open('x') as f:
                          json.dump({'returncode': rc}, f)
                      os.replace(root / 'runtime-status.partial', root / 'runtime-status.json')
                  os._exit(0)
              with (root / 'owner.json').open('x') as f:
                  json.dump({'pid': pid, 'ticks': ticks(pid)}, f)
              until = time.monotonic() + 90
              while time.monotonic() < until:
                  if (root / 'runtime-status.json').exists():
                      raise ValueError()
                  if ticks(pid) != json.loads((root / 'owner.json').read_text())['ticks']:
                      raise ValueError()
                  if (root / 'session' / 'arm.json').is_file():
                      break
                  time.sleep(1)
              else:
                  raise ValueError()
          except BaseException:
              sys.exit('hosted_pilot_start_failed')
          PY

      - name: Publish public arm while runtime remains running
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-arm-${{ github.run_id }}-a1
          path: ${{ env.TALLI_RECOVERY_DIR }}/session/arm.json
          if-no-files-found: error
          retention-days: 1

      - name: Await retained runtime completion within its absolute deadline
        timeout-minutes: 11
        run: |
          set -euo pipefail
          apps/backend/.venv/bin/python -B - <<'PY'
          import json, os, sys, time
          from datetime import datetime
          from pathlib import Path
          try:
              root = Path(os.environ['TALLI_RECOVERY_DIR'])
              config = json.loads((root / 'config.json').read_text())
              owner = json.loads((root / 'owner.json').read_text())
              seconds = max(0, datetime.fromisoformat(config['cleanupAtUtc']).timestamp() - time.time())
              seconds = min(660, seconds + config['cleanupSeconds'] + 30)
              until = time.monotonic() + seconds
              while time.monotonic() < until:
                  status = root / 'runtime-status.json'
                  if status.exists():
                      if json.loads(status.read_text())['returncode'] != 0 or not (root / 'session/result.json').is_file():
                          raise ValueError()
                      break
                  actual = Path('/proc/' + str(owner['pid']) + '/stat').read_text().rsplit(')', 1)[1].split()[19]
                  if actual != owner['ticks']:
                      raise ValueError()
                  time.sleep(1)
              else:
                  raise ValueError()
          except BaseException:
              sys.exit('hosted_pilot_completion_unverified')
          PY

      - name: Stop retained child before collecting final result (best effort)
        if: ${{ always() && env.TALLI_RECOVERY_DIR != '' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          apps/backend/.venv/bin/python -B - <<'PY'
          import json, os, signal, sys, time
          from pathlib import Path
          try:
              root = Path(os.environ['TALLI_RECOVERY_DIR'])
              if (root / 'owner.json').exists() and not (root / 'runtime-status.json').exists():
                  owner = json.loads((root / 'owner.json').read_text())
                  actual = Path('/proc/' + str(owner['pid']) + '/stat').read_text().rsplit(')', 1)[1].split()[19]
                  if actual != owner['ticks']:
                      raise ValueError()
                  os.kill(owner['pid'], signal.SIGTERM)
                  until = time.monotonic() + 20
                  while time.monotonic() < until and not (root / 'runtime-status.json').exists():
                      time.sleep(1)
                  if not (root / 'runtime-status.json').exists():
                      actual = Path('/proc/' + str(owner['pid']) + '/stat').read_text().rsplit(')', 1)[1].split()[19]
                      if actual == owner['ticks']:
                          # No cleanup conclusion after forced termination.
                          os.killpg(owner['pid'], signal.SIGKILL)
                      raise ValueError()
          except BaseException:
              sys.exit('hosted_pilot_stop_unverified')
          PY

      - name: Collect public result only
        if: ${{ always() && env.TALLI_RECOVERY_DIR != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-result-${{ github.run_id }}-a1
          path: ${{ env.TALLI_RECOVERY_DIR }}/session/result.json
          if-no-files-found: warn
          retention-days: 1

      - name: Remove owned private work, credentials and ephemeral key
        if: ${{ always() && env.TALLI_RECOVERY_DIR != '' }}
        run: |
          set -euo pipefail
          apps/backend/.venv/bin/python -B - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          try:
              root = Path(os.environ['TALLI_RECOVERY_DIR'])
              if (root.parent != Path(os.environ['RUNNER_TEMP']).resolve()
                      or not root.name.startswith('talli-recovery-')
                      or any(p.is_symlink() for p in (root, *root.parents))
                      or root.stat().st_uid != os.getuid() or root.stat().st_mode & 0o077):
                  raise ValueError()
              shutil.rmtree(root)
          except BaseException:
              sys.exit('hosted_pilot_private_cleanup_failed')
          PY
